<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path of Titans ダメージ計算機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <h1>Path of Titans ダメージ計算機</h1>
    <p class="subtitle">恐竜を選択するか、各ステータスを直接手動で入力・修正できます</p>

    <div class="duo-container">
      <!-- 攻撃側 (Attacker) -->
      <div class="card attacker-card">
        <h2>⚔️ 攻撃側 (Attacker)</h2>
        <div class="form-group">
          <label for="attacker-select">プリセット選択:</label>
          <select id="attacker-select">
            <option value="">-- JSONから選択 --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="attacker-weight">戦闘重量 (Combat Weight):</label>
          <input type="number" id="attacker-weight" value="4000" step="50" min="1">
        </div>
        <div class="form-group">
          <label for="attacker-attack">使用する攻撃 (威力):</label>
          <select id="attacker-attack-select">
            <option value="custom">手動入力</option>
          </select>
        </div>
        <div class="form-group">
          <label for="attacker-damage">攻撃の基本威力 (Base Damage):</label>
          <input type="number" id="attacker-damage" value="50" step="1" min="0">
        </div>
      </div>

      <!-- 防御側 (Defender) -->
      <div class="card defender-card">
        <h2>🛡️ 防御側 (Defender)</h2>
        <div class="form-group">
          <label for="defender-select">プリセット選択:</label>
          <select id="defender-select">
            <option value="">-- JSONから選択 --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="defender-hp">最大HP (Max Health):</label>
          <input type="number" id="defender-hp" value="600" step="10" min="1">
        </div>
        <div class="form-group">
          <label for="defender-weight">戦闘重量 (Combat Weight):</label>
          <input type="number" id="defender-weight" value="4000" step="50" min="1">
        </div>
        <div class="form-group">
          <label for="defender-armor">初期鎧値 (Armor Value):</label>
          <input type="number" id="defender-armor" value="1.0" step="0.05" min="0.1">
          <small>※通常は 1.0（サブスピーシーズやスキル等で可変）</small>
        </div>
        <div class="form-group">
          <label for="hit-location">ヒット部位 / 状態:</label>
          <select id="hit-location">
            <option value="1.0">胴体 (Body - 1.0x)</option>
            <option value="1.2">頭部 (Head - 1.2x)</option>
            <option value="0.25">尻尾 (Tail - 0.25x)</option>
            <option value="2.0">お座り状態 (Sitting - 2.0x)</option>
            <option value="4.0">睡眠状態 (Sleeping - 4.0x)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 計算結果表示エリア -->
    <div class="card result-card">
      <h2>📊 計算結果</h2>
      <div class="results-grid">
        <div class="result-box">
          <span class="label">1打あたりのダメージ</span>
          <span class="value" id="res-damage">0</span>
        </div>
        <div class="result-box">
          <span class="label">HPに占める割合</span>
          <span class="value" id="res-percent">0%</span>
        </div>
        <div class="result-box highlight">
          <span class="label">撃破に必要な攻撃回数 (Hits to Kill)</span>
          <span class="value" id="res-htk">0</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
